version: '3.9'

services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: miniocsv
    ports:
      - "9000:9000"
      - "9090:9090"
    volumes:
      - minio_storage:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin759
    command: server --console-address ":9090" /data

volumes:
  minio_storage: {}